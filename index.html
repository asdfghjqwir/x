<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS依存・人生損失診断</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #00F5FF; 
            --accent-pink: #FF007F; 
            --card-white: #ffffff;
            --black: #1A1A1A;
            --yellow: #FFD700;
        }
        
        body { background-color: var(--bg-color); font-family: 'M PLUS Rounded 1c', sans-serif; margin: 0; padding: 20px 0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }

        #app { 
            width: 92%; max-width: 420px; background: var(--card-white); border: 5px solid var(--black); 
            border-radius: 25px; box-shadow: 10px 10px 0px var(--black); 
            padding: 25px; text-align: center; box-sizing: border-box; margin: auto;
        }

        #quiz, #loading, #result { display: none; }
        #quiz { display: block; }

        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: 900; }
        input { 
            width: 100%; padding: 12px; border: 4px solid var(--black); border-radius: 12px;
            box-shadow: 4px 4px 0px var(--black); margin-top: 5px; box-sizing: border-box; 
            font-size: 1.1rem; font-weight: 900; outline: none;
        }

        .rank-label { font-size: 1rem; font-weight: 900; background: var(--black); color: white; padding: 4px 12px; border-radius: 8px; display: inline-block; }
        #result-rank { 
            font-size: 2.8rem; font-weight: 900; margin: 10px 0; line-height: 1.1;
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 4px 4px 0px var(--black);
        }

        .loss-container { margin: 20px 0; padding: 15px; border: 3px dashed var(--black); border-radius: 15px; background: #fff9e6; }
        .loss-title { font-size: 0.8rem; font-weight: 900; color: #555; }
        .total-loss { font-size: 1.8rem; font-weight: 900; color: #ff0000; margin: 5px 0; }
        .hourly-value { font-size: 1rem; font-weight: 900; color: var(--black); }

        .roast-card { 
            background: #F0F0F0; border: 4px solid var(--black); border-radius: 15px;
            padding: 15px; margin: 15px 0; text-align: left; font-weight: 800; font-size: 0.9rem; line-height: 1.5;
        }

        .timer-box { 
            background: var(--black); color: #00FF41; padding: 12px; border-radius: 12px;
            font-family: monospace; margin-top: 10px;
        }
        .live-amount { font-size: 2rem; color: #FF4D4D; font-weight: 900; }

        button, .physics-button { 
            width: 100%; padding: 15px; border: 4px solid var(--black); border-radius: 50px;
            font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: 0.1s;
            box-shadow: 0 5px 0px var(--black); text-decoration: none; display: block; box-sizing: border-box;
        }
        button:active { transform: translateY(3px); box-shadow: 0 2px 0px var(--black); }

        .btn-main { background: var(--yellow); color: var(--black); margin-top: 10px; }
        .share-btn { background: #1DA1F2; color: white; margin-top: 15px; }
        .physics-button { background: var(--accent-pink); color: white !important; margin-top: 20px; line-height: 1.2; }
    </style>
</head>
<body>

<div id="app">
    <div id="quiz">
        <h1>📱 SNS依存度<br>人生損失診断</h1>
        <div class="input-group">
            <label>1日のSNS利用時間 (時間)</label>
            <input type="number" id="snsTime" inputmode="decimal" placeholder="例: 5">
        </div>
        <div class="input-group">
            <label>あなたの月収 (万円)</label>
            <input type="number" id="income" inputmode="numeric" placeholder="例: 30">
        </div>
        <button class="btn-main" onclick="diagnose()">⚡️ 解析を開始する</button>
    </div>

    <div id="loading">
        <h2 style="font-size: 2.5rem;">🌀</h2>
        <h2>解析中...</h2>
        <p>嘘を暴いています...</p>
    </div>

    <div id="result">
        <span class="rank-label">判定：</span>
        <h1 id="result-rank">判定中</h1>

        <div class="loss-container">
            <div class="loss-title">あなたがSNSに献上した人生の価値：</div>
            <div class="total-loss" id="totalLossDisplay">¥0</div>
            <div class="loss-title">現在のあなたの時給換算：</div>
            <div class="hourly-value" id="hourlyDisplay">¥0 (実質価値)</div>
        </div>
        
        <div class="roast-card">
            <p id="roast-text"></p>
            <div class="timer-box">
                <p style="margin:0; font-size:0.7rem; color: #aaa;">診断中も溶け続ける人生：</p>
                <div class="live-amount">¥<span id="ticker">0.00</span></div>
            </div>
        </div>
        
        <button class="share-btn" onclick="shareX()">🐦 Xで恥を晒す</button>
        <a href="https://buy.stripe.com/あなたのリンク" class="physics-button">⚠️ 救済措置を受け取る (¥100)<br><small style="font-size: 0.7rem; font-weight: normal;">※運営者にコーヒーを奢る</small></a>
    </div>
</div>

<script>
    const roasts = [
        "「いいね」を稼いでも、あなたの銀行残高は増えません。通知ドパミンに脳を焼かれた、ただの無料マシーンです。",
        "情報の海を泳いでいるつもりですか？実際はアルゴリズムという網に掛かった動けない魚ですよ。",
        "スクロールする指の動きだけは一流。その指で生産していれば、今頃あなたは「売る側」にいたはずなのに。",
        "あなたが『無料』でSNSを楽しんでいる時、支払っている対価は『人生の時間』そのものです。",
        "画面の向こう側の成功者を見て満足ですか？彼らはあなたのような『観客』がいるおかげで稼いでいます。",
        "スマホのバッテリー残量には敏感なのに、自分の人生の残り時間には無頓着。優先順位、バグってませんか？",
        "SNSを開くたびに、あなたの脳の一部が広告最適化のために切り売りされています。人間をやめてデータになりたいんですか？",
        "他人のランチの写真を見て、何が手に入りましたか？手元に残ったのは、虚無感と熱くなったスマホだけです。",
        "1日の4分の1を画面に捧げる。それは人生の4分の1を『なかったこと』にするのと同じです。",
        "死ぬ間際、あなたは『もっとSNSを見ておけばよかった』と後悔するんでしょうか。そんなわけないですよね。",
        "アルゴリズムはあなたを理解していますが、あなたは自分を理解していません。飼い慣らされた自覚はありますか？",
        "最新トレンドを追っているつもりで、実は古いアルゴリズムのレールの上。あなたの思考、賞味期限切れですよ？",
        "デジタルな世界でどれだけ着飾っても、現実のあなたはスマホの光に照らされた、ただの寂しい消費者です。",
        "情報のインプット過多で、脳がデブになっています。たまにはアウトプットという名の生産をしたらどうですか？",
        "あなたが画面を閉じられないのは意志が弱いからではありません。数千人の天才エンジニアがあなたを依存させるために設計した罠に、まんまとハマっているだけです。"
    ];

    let globalRank = "";
    let startTime;
    let lossPerSecond = 0;

    function diagnose() {
        const sVal = document.getElementById('snsTime').value;
        const iVal = document.getElementById('income').value;

        if (sVal === "" || iVal === "") { 
            alert('数値を入力してください。現実から逃げないで。'); 
            return; 
        }

        const snsTime = parseFloat(sVal);
        const income = parseFloat(iVal);

        document.getElementById('quiz').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            const hourly = (income * 10000) / 160; 
            const totalLifetimeLoss = hourly * snsTime * 365 * 40; 
            lossPerSecond = (hourly / 3600) * (snsTime / 2); 
            
            document.getElementById('totalLossDisplay').innerText = `¥${Math.floor(totalLifetimeLoss).toLocaleString()}`;
            document.getElementById('hourlyDisplay').innerText = `¥${Math.floor(hourly).toLocaleString()} (実質価値)`;
            
            let color = "";
            if (snsTime >= 10) { globalRank = "末期デジタル廃人"; color = "#ff0000"; }
            else if (snsTime >= 7) { globalRank = "アルゴリズムの奴隷"; color = "#FF007F"; }
            else if (snsTime >= 4) { globalRank = "標準的デジタル家畜"; color = "#000000"; }
            else if (snsTime >= 2) { globalRank = "無自覚な養分"; color = "#333333"; }
            else { globalRank = "自律した人間"; color = "#00B2EE"; }
            
            const rankElement = document.getElementById('result-rank');
            rankElement.innerText = globalRank;
            rankElement.style.color = color;

            document.getElementById('roast-text').innerText = roasts[Math.floor(Math.random() * roasts.length)];
            
            startTime = Date.now();
            updateTicker();
        }, 1500);
    }

    function updateTicker() {
        const elapsed = (Date.now() - startTime) / 1000;
        document.getElementById('ticker').innerText = (elapsed * lossPerSecond).toFixed(2);
        requestAnimationFrame(updateTicker);
    }

    function shareX() {
        const rankText = `【診断結果：${globalRank}】`;
        const lossText = document.getElementById('totalLossDisplay').innerText;
        const text = encodeURIComponent(`${rankText}\n私がSNSに献上した人生の価値は「${lossText}」でした…。\n今この瞬間も、秒単位で溶け続けています。\n\n#SNS依存診断 #デジタル家畜`);
        const url = encodeURIComponent(window.location.href);
        const xUrl = `https://x.com/intent/post?text=${text}&url=${url}`;
        window.open(xUrl, '_blank', 'noopener,noreferrer');
    }
</script>
</body>
</html>
